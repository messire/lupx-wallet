<div class="shell" (keydown.escape)="closeMenu()">
  <aside id="shell-nav" class="shell-sidebar" [class.open]="menuOpen()">
    <span class="brand">LupexWallet</span>

    <nav class="shell-nav-list" aria-label="Разделы приложения">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [ariaCurrentWhenActive]="'page'" (click)="closeMenu()">{{
          item.label
        }}</a>
      }
    </nav>

    <app-button class="logout" variant="ghost" (click)="logout()">Выйти</app-button>
  </aside>

  @if (menuOpen()) {
    <div class="shell-backdrop" (click)="closeMenu()"></div>
  }

  <div class="shell-workspace">
    <header class="shell-topbar">
      <span class="topbar-brand">LupexWallet</span>
      <button
        #menuToggleButton
        type="button"
        class="menu-toggle"
        aria-controls="shell-nav"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Меню разделов"
        (click)="toggleMenu()"
      >
        <span class="menu-toggle-icon" aria-hidden="true">
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
        </span>
        <span class="menu-toggle-label">Меню</span>
      </button>
    </header>

    <main class="shell-content">
      <router-outlet />
    </main>
  </div>
</div>
