openapi: "3.1.0"
info:
  title: LupexWallet API
  version: "1.0.0"
  description: >
    REST API однопользовательского приложения учета личных финансов.
    Технические идентификаторы — на английском, см. docs/architecture/ddd-model.md
    для доменной модели и docs/database/schema.md для схемы БД.
  license:
    name: Proprietary — внутренний проект, не публикуется
servers:
  - url: /api/v1

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Вход по единому паролю приложения (без регистрации/ролей).
  - name: Wallets
    description: Управление кошельками, основной кошелек, текущий баланс.
  - name: WalletTypes
    description: Расширяемый справочник типов кошельков.
  - name: OperationTypes
    description: Расширяемый справочник типов операций.
  - name: OperationBehaviorKinds
    description: Системный справочник видов поведения операции (только чтение).
  - name: Currencies
    description: >
      Доступные валюты (список сервиса курсов, только чтение) и активные валюты
      пользователя (ADR-0004, §7).
  - name: Operations
    description: >
      Доходы, расходы, корректировки баланса дельтой и заявленный баланс на дату
      с рассчитываемой системой корректирующей суммой (ADR-0003, §6).
  - name: Transfers
    description: Переводы между кошельками одной валюты.
  - name: BalanceHistory
    description: Текущий и исторический баланс кошелька по слепкам.
  - name: ExchangeRates
    description: Курсы валют от Frankfurter, ручное и автоматическое обновление.
  - name: Reporting
    description: Общая сумма по всем кошелькам — текущая и историческая.
  - name: Audit
    description: Неизменяемый журнал изменений финансовых данных.
  - name: Planning
    description: >
      Плановые операции — разовые и повторяющиеся будущие доходы и расходы, их вычисляемые
      наступления, отклонения и исполнение обычной операцией (ADR-0010, §6).
  - name: Creditors
    description: Справочник кредиторов модуля Debts — общий для долгов и кредитов (ADR-0010 §3).
  - name: Debts
    description: Долги перед кредиторами; погашение — обычный расход из кошелька (ADR-0010 §3, issue #6).
  - name: Loans
    description: Кредиты с графиком платежей, без процентов (ADR-0010 §3, В5, issue #8).
  - name: ExpenseCategories
    description: >
      Справочник категорий расходов модуля Budgeting (ADR-0010 §5, В1): название и
      типы операций с поведением «Расход»; тип входит не более чем в одну категорию.
  - name: Budgets
    description: >
      Месячные бюджеты (месяц + валюта) с лимитами по категориям и исполнение бюджета
      (ADR-0010 §5, В8). Бюджет ничего не резервирует и не меняет балансы.
  - name: Funds
    description: >
      Целевые фонды и резервирование денег кошельков без изменения балансов
      (ADR-0010, §4).

paths:
  # ---------- Auth ----------
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход по единому паролю приложения
      operationId: login
      security: []   # эндпоинт логина не требует токена
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------- Wallets ----------
  /wallets:
    get:
      tags: [Wallets]
      summary: Список кошельков
      operationId: listWallets
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Страница кошельков, отсортированная по displayOrder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Wallets]
      summary: Создать кошелек (UC-01)
      operationId: createWallet
      description: >
        Валюта задается кодом. Если код есть среди доступных валют, но валюта еще не активна,
        она становится активной в той же транзакции, что и создание кошелька; если уже активна —
        используется существующая. При отклонении создания кошелька активация откатывается
        (ADR-0004, §7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletCreateRequest" }
      responses:
        "201":
          description: Кошелек создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "400":
          description: >
            Ошибка валидации либо валюта недоступна: код не активен и не входит в список
            доступных валют. Валюта в этом случае не создается.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wallets/{walletId}:
    parameters:
      - $ref: "#/components/parameters/WalletIdParam"
    get:
      tags: [Wallets]
      summary: Получить кошелек
      operationId: getWallet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Wallets]
      summary: Изменить атрибуты кошелька (UC-02, без валюты)
      operationId: updateWallet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletUpdateRequest" }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Wallets]
      summary: Удалить кошелек без истории (UC-04)
      operationId: deleteWallet
      description: >
        История кошелька — только операции, включая мягко удаленные (ADR-0002, §2);
        слепки баланса историей не считаются. Заявленные балансы и их корректирующие суммы
        (isCorrection = true, ADR-0003, §6) тоже историей не считаются и удаляются вместе
        с кошельком: кошелек, у которого есть только они, удаляется (204).
      responses:
        "204": { description: Удален; слепки баланса и корректирующие суммы заявленных балансов удаляются вместе с кошельком }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            У кошелька есть операции (включая удаленные; корректирующие суммы заявленных
            балансов операциями не считаются) — используйте /archive — или он основной.
            Деньги кошелька зарезервированы в активном фонде (ADR-0010, §4; type
            https://lupexwallet/errors/wallet-has-reservations).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /wallets/{walletId}/archive:
    parameters:
      - $ref: "#/components/parameters/WalletIdParam"
    post:
      tags: [Wallets]
      summary: Архивировать кошелек (UC-03)
      operationId: archiveWallet
      responses:
        "200":
          description: Архивирован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Нельзя архивировать текущий основной кошелек (решено, Q7). Нельзя архивировать
            кошелек, деньги которого зарезервированы в активном фонде, пока резерв не снят
            (ADR-0010, §4; type https://lupexwallet/errors/wallet-has-reservations).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /wallets/{walletId}/set-primary:
    parameters:
      - $ref: "#/components/parameters/WalletIdParam"
    post:
      tags: [Wallets]
      summary: Назначить кошелек основным (UC-05)
      operationId: setPrimaryWallet
      responses:
        "200":
          description: Назначен основным; include_in_total принудительно включен (Q8)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Нельзя назначить основным архивный кошелек.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /wallets/{walletId}/currency:
    parameters:
      - $ref: "#/components/parameters/WalletIdParam"
    put:
      tags: [Wallets]
      summary: Сменить валюту кошелька — только если нет истории (решено, Q15)
      operationId: changeWalletCurrency
      description: >
        История кошелька — только операции, включая мягко удаленные (ADR-0002, §2).
        Слепки баланса историей не считаются: при смене валюты они перестраиваются
        в новой валюте (старые удаляются, новые создаются от даты начала учета).
        Новая валюта должна быть активной (входить в GET /currencies).
        Заявленные балансы смену валюты не блокируют: их корректирующие суммы
        (ADR-0003, §6) историей не считаются, переходят в новую валюту с кошельком,
        числа не меняются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletChangeCurrencyRequest" }
      responses:
        "200":
          description: Валюта изменена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "400":
          description: Валюта с таким идентификатором не активна (не найдена среди активных).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            У кошелька уже есть операции (включая удаленные; корректирующие суммы
            заявленных балансов операциями не считаются). Деньги кошелька зарезервированы
            в активном фонде — валюта кошелька должна совпадать с валютой фонда (ADR-0010, §4;
            type https://lupexwallet/errors/wallet-has-reservations).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /wallets/{walletId}/balance:
    parameters:
      - $ref: "#/components/parameters/WalletIdParam"
    get:
      tags: [BalanceHistory]
      summary: Баланс кошелька на дату (UC-18, UC-20)
      operationId: getWalletBalance
      description: >
        Без параметра date возвращает текущий баланс. Для даты раньше
        accounting_start_date возвращает сумму 0 (решено, Q13). Мягко удаленные
        операции в расчете не учитываются (ADR-0002, §3). Корректирующие суммы заявленных
        балансов (ADR-0003, §6) в расчет входят: баланс на дату заявленного баланса равен
        заявленному значению.
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceSnapshot" }
        "404": { $ref: "#/components/responses/NotFound" }

  /wallets/{walletId}/balance-history:
    parameters:
      - $ref: "#/components/parameters/WalletIdParam"
    get:
      tags: [BalanceHistory]
      summary: История слепков баланса кошелька за период
      operationId: listWalletBalanceHistory
      description: >
        Мягко удаленные операции в слепках не учитываются (ADR-0002, §3). Корректирующие
        суммы заявленных балансов (ADR-0003, §6) в слепки входят: слепок на дату заявленного
        баланса равен заявленному значению.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceSnapshotPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Reference data ----------
  /wallet-types:
    get:
      tags: [WalletTypes]
      summary: Список типов кошельков
      operationId: listWalletTypes
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [WalletTypes]
      summary: Добавить тип кошелька (UC-28, раздел 7)
      operationId: createWalletType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceItemCreateRequest" }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceItem" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /wallet-types/{id}/deactivate:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [WalletTypes]
      summary: Деактивировать тип кошелька (решено, Q11)
      operationId: deactivateWalletType
      responses:
        "200":
          description: Деактивирован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceItem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /wallet-types/{id}:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    delete:
      tags: [WalletTypes]
      summary: Удалить неиспользуемый тип кошелька
      operationId: deleteWalletType
      responses:
        "204": { description: Удален }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Тип используется кошельком (включая архивные) —
            используйте деактивацию.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /operation-types:
    get:
      tags: [OperationTypes]
      summary: Список типов операций
      operationId: listOperationTypes
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
        - name: behaviorKindId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationTypePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [OperationTypes]
      summary: Добавить тип операции (UC-15)
      operationId: createOperationType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationTypeCreateRequest" }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationType" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /operation-types/{id}/deactivate:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [OperationTypes]
      summary: Деактивировать тип операции
      operationId: deactivateOperationType
      responses:
        "200":
          description: Деактивирован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationType" }
        "404": { $ref: "#/components/responses/NotFound" }

  /operation-types/{id}:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    delete:
      tags: [OperationTypes]
      summary: Удалить неиспользуемый тип операции
      operationId: deleteOperationType
      responses:
        "204": { description: Удален }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Тип используется операцией (включая удаленные) —
            используйте деактивацию.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /operation-behavior-kinds:
    get:
      tags: [OperationBehaviorKinds]
      summary: Системный справочник видов поведения операции (только чтение)
      operationId: listOperationBehaviorKinds
      description: >
        Income | Expense | Transfer | Adjustment. Без create/update/delete —
        набор фиксирован при развертывании (ddd-model.md, §2.3).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationBehaviorKind" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /currencies/available:
    get:
      tags: [Currencies]
      summary: Доступные валюты — список сервиса курсов
      operationId: listAvailableCurrencies
      description: >
        Весь список доступных валют из БД, отсортированный по code, без пагинации; к сервису
        курсов не обращается. Список обновляется при каждом обновлении курсов (ADR-0004, §7);
        до первой загрузки — пустой массив. Названия английские, из сервиса.
        isActive — валюта уже добавлена в активные.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailableCurrency" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /currencies:
    get:
      tags: [Currencies]
      summary: Список активных валют
      operationId: listCurrencies
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrencyPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Currencies]
      summary: Добавить валюту в активные из доступных
      operationId: createCurrency
      description: >
        Код должен быть в списке доступных валют (GET /currencies/available); название
        берется из него. Произвольные коды и криптовалюты вне списка сервиса не принимаются
        (ADR-0004, §7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrencyCreateRequest" }
      responses:
        "201":
          description: Валюта добавлена в активные
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Currency" }
        "400":
          description: Ошибка валидации либо кода нет среди доступных валют.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Валюта с таким кодом уже активна.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /currencies/{id}:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    delete:
      tags: [Currencies]
      summary: Убрать валюту из активных
      operationId: deleteCurrency
      description: >
        Использование — ссылки от кошельков (включая архивные) и операций (включая мягко
        удаленные). Курсы (последние и исторические) и данные о покрытии истории
        использованием не считаются и удаляются вместе с валютой (ADR-0002, §4;
        ADR-0004, §7). Валюта остается в списке доступных.
      responses:
        "204": { description: Убрана из активных вместе с ее курсами }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Валюта используется кошельком или операцией (включая удаленные).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------- Operations ----------
  /operations:
    get:
      tags: [Operations]
      summary: Список операций (UC-11, UC-12)
      operationId: listOperations
      description: >
        Мягко удаленные операции включаются всегда (ADR-0002, §3, §5); признак —
        isDeleted = true. Параметра скрытия удаленных нет.

        Корректирующие суммы заявленных балансов (isCorrection = true, ADR-0003, §6)
        включаются в список наравне с обычными операциями, кроме сумм, равных нулю: нулевая
        корректирующая сумма не показывается (§6, п.7). Порядок записей — по дате
        операции по возрастанию; внутри одного дня корректирующая сумма идет после всех
        остальных операций этого дня (§6, п.4). Курсорная пагинация учитывает этот порядок:
        без дублей и пропусков. Фильтр operationTypeId корректирующие суммы не включает —
        у них нет типа операции. Фильтры walletId, dateFrom и dateTo применяются к ним как
        к обычным операциям.
      parameters:
        - name: walletId
          in: query
          schema: { type: string, format: uuid }
        - name: operationTypeId
          in: query
          description: Только операции этого типа; корректирующие суммы (без типа) в выборку не попадают.
          schema: { type: string, format: uuid }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Operations]
      summary: Создать операцию дохода/расхода/корректировки дельтой (UC-11, UC-12, UC-24)
      operationId: createOperation
      description: >
        Для перевода используйте POST /transfers, а не этот эндпоинт (раздел 4).
        Корректировка — только дельтой (adjustmentMode = Delta); новое значение баланса
        на дату задается через PUT /wallets/{walletId}/stated-balances/{date}.
        Если на дату операции или позже у кошелька есть заявленный баланс, корректирующие
        суммы пересчитываются в той же транзакции (ADR-0003, §6, п.3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationCreateRequest" }
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400":
          description: >
            Ошибка валидации, либо adjustmentMode = Absolute: значение не поддерживается,
            новое значение баланса задается действием «Указать баланс на дату»
            (PUT /wallets/{walletId}/stated-balances/{date}); любое другое неизвестное или
            числовое значение adjustmentMode тоже отклоняется (принимаются только имена
            членов перечисления).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OperationIdParam"
    get:
      tags: [Operations]
      summary: Получить операцию
      operationId: getOperation
      description: >
        Возвращает и корректирующую сумму, равную нулю: в списке она скрыта, но запись
        существует (ADR-0003, §6, п.7).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Operations]
      summary: Редактировать операцию (UC-13) — каскадный пересчет истории (Q4)
      operationId: updateOperation
      description: >
        Если изменение влияет на баланс на дату заявленного баланса кошелька (в том числе
        при переносе на другой кошелек — на оба), корректирующие суммы пересчитываются
        в той же транзакции (ADR-0003, §6, п.3). Корректирующую сумму редактировать нельзя
        (§6, п.6) — 409; эта проверка выполняется раньше остальных.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationUpdateRequest" }
      responses:
        "200":
          description: Обновлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400":
          description: >
            Ошибка валидации, либо adjustmentMode = Absolute: значение не поддерживается,
            новое значение баланса задается действием «Указать баланс на дату»
            (PUT /wallets/{walletId}/stated-balances/{date}); любое другое неизвестное или
            числовое значение adjustmentMode тоже отклоняется. Порядок ответов: 404, затем 409
            (корректирующая сумма, удалена, часть перевода, параллельное изменение), затем 400.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Операция — корректирующая сумма: ее рассчитывает система, редактировать нельзя
            (чтобы изменить сумму, добавьте недостающую операцию или исправьте существующую;
            чтобы заменить заявленный баланс — повторите PUT на ту же дату); либо операция —
            часть перевода и редактируется/удаляется только через перевод целиком
            (раздел 4 требований); либо операция удалена — сначала восстановите
            (POST /operations/{operationId}/restore); либо запись изменена параллельно
            (например, удалена в другой вкладке) — обновите список.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [Operations]
      summary: Удалить операцию (мягко, UC-14)
      operationId: deleteOperation
      description: >
        Мягкое удаление (ADR-0002, §3) с любой датой, включая сегодняшнюю: запись остается
        в БД и в списках с isDeleted = true, исключается из расчетов (баланс кошелька,
        слепки, общая сумма), запускается каскадный пересчет истории от даты операции.
        Восстановление — POST /operations/{operationId}/restore. Корректирующие суммы
        заявленных балансов после удаления пересчитываются в той же транзакции
        (ADR-0003, §6, п.3). Корректирующая сумма мягкому удалению не подлежит
        (ADR-0002, §3; ADR-0003, §6, п.6).
      responses:
        "204": { description: Удалена }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Операция — корректирующая сумма: ее рассчитывает система, удалить нельзя;
            либо операция — часть перевода (удалите через DELETE /transfers/{id}); либо уже
            удалена; либо запись изменена параллельно — обновите список.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /operations/{operationId}/restore:
    parameters:
      - $ref: "#/components/parameters/OperationIdParam"
    post:
      tags: [Operations]
      summary: Восстановить удаленную операцию (ADR-0002, §3)
      operationId: restoreOperation
      description: >
        Снимает мягкое удаление: операция снова участвует в расчетах, история баланса
        пересчитывается от даты операции. Корректирующие суммы заявленных балансов
        пересчитываются в той же транзакции (ADR-0003, §6, п.3). Корректирующая сумма
        не удаляется, поэтому восстанавливать ее нечего (ADR-0002, §3).
      responses:
        "200":
          description: Восстановлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Операция — корректирующая сумма: ее рассчитывает система, восстанавливать
            нельзя; либо операция — часть перевода (восстановите через
            POST /transfers/{id}/restore); либо не удалена; либо запись изменена
            параллельно — обновите список.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /wallets/{walletId}/stated-balances/{date}:
    parameters:
      - $ref: "#/components/parameters/WalletIdParam"
      - name: date
        in: path
        required: true
        description: >
          Дата, на конец дня которой заявляется баланс. Допустимый диапазон —
          от даты начала учета кошелька (accountingStartDate) до сегодняшней даты включительно.
        schema: { type: string, format: date }
    put:
      tags: [Operations]
      summary: Указать баланс кошелька на конец дня (UC-24, ADR-0003, §6)
      operationId: setStatedBalance
      description: >
        Заявляет баланс X кошелька на конец дня из пути. Заявленный баланс — факт от
        пользователя, система его не меняет; расхождение с операциями записывается как
        корректирующая сумма на эту дату (§6, п.1–2): X минус баланс на конец дня без нее.
        В ответе — эта корректирующая сумма (Operation с isCorrection = true,
        statedBalance = X, amount — сумма со знаком, operationTypeId = null,
        adjustmentMode = null); она может быть нулевой.

        Повторный ввод на ту же дату заменяет прежнее значение (§6, п.8): запись та же, id не
        меняется; ввод того же значения — 200 без изменений. Отдельной записи для управления
        заявленным балансом нет: отменить его нельзя, только заменить.

        Все операции с датой на день заявления и раньше входят в баланс на конец дня и
        поглощаются корректирующей суммой, в том числе внесенные позже (§6, п.4). Несколько
        заявленных балансов обрабатываются по порядку дат (§6, п.5). Корректирующие суммы
        кошелька, баланс кошелька, слепки истории и аудит обновляются в одной транзакции;
        каскадный пересчет слепков идет от даты заявления до сегодня (ADR-0003, §2).
        Пример: операции +500 (1 сентября) и −200 (10 сентября), заявлено 350 на
        10 сентября → корректирующая сумма +50 («Неизвестные доходы»).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatedBalanceRequest" }
      responses:
        "201":
          description: Баланс на эту дату заявлен впервые; создана корректирующая сумма.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "200":
          description: Баланс на эту дату уже был заявлен; прежнее значение заменено.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400":
          description: >
            Дата вне диапазона [accountingStartDate .. сегодня] либо сумма невалидна
            (не число). Отрицательная сумма допустима.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Запись изменена параллельно — повторите запрос.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------- Transfers ----------
  /transfers:
    get:
      tags: [Transfers]
      summary: Список переводов
      operationId: listTransfers
      description: >
        Мягко удаленные переводы включаются всегда (ADR-0002, §3, §5); признак —
        isDeleted = true. Параметра скрытия удаленных нет.
      parameters:
        - name: walletId
          in: query
          schema: { type: string, format: uuid }
          description: Кошелек как источник ИЛИ получатель.
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Transfers]
      summary: Создать перевод между кошельками одной валюты (UC-16)
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferCreateRequest" }
      responses:
        "201":
          description: Перевод создан (атомарно с двумя операциями)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Валюты кошельков не совпадают (раздел 4) либо кошельки совпадают.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /transfers/{transferId}:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Transfers]
      summary: Получить перевод
      operationId: getTransfer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Transfers]
      summary: Удалить перевод (мягко, обе операции атомарно, UC-16)
      operationId: deleteTransfer
      description: >
        Мягкое удаление (ADR-0002, §3) перевода и обеих его операций с любой датой:
        запись остается в БД и в списках с isDeleted = true, исключается из расчетов
        (баланс кошельков, слепки, общая сумма), запускается каскадный пересчет истории
        обоих кошельков. Восстановление — POST /transfers/{transferId}/restore.
      responses:
        "204": { description: Удален }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Перевод уже удален либо запись изменена параллельно — обновите список.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /transfers/{transferId}/restore:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Transfers]
      summary: Восстановить удаленный перевод (обе операции атомарно, ADR-0002, §3)
      operationId: restoreTransfer
      description: >
        Снимает мягкое удаление с перевода и обеих его операций; они снова участвуют в
        расчетах, история обоих кошельков пересчитывается от даты перевода.
      responses:
        "200":
          description: Восстановлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Перевод не удален либо запись изменена параллельно — обновите список.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------- Exchange rates ----------
  /exchange-rates/latest:
    get:
      tags: [ExchangeRates]
      summary: Последние известные курсы к текущей основной валюте (UC-08, UC-10)
      operationId: getLatestExchangeRates
      description: Читает только БД, к Frankfurter не обращается (ADR-0004, §8).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LatestExchangeRates" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /exchange-rates/refresh:
    post:
      tags: [ExchangeRates]
      summary: Ручное обновление курсов (UC-09) — сбрасывает суточный таймер
      description: >
        Обновляет курсы только активных валют к валюте основного кошелька независимо от
        наличия кошельков в этих валютах. Пара валюты с самой собой пропускается; без
        основного кошелька курсы не обновляются. Также обновляет список доступных валют
        (GET /currencies/available), в том числе без основного кошелька. Историю курсов в
        запросе не дозагружает: после ответа фоновый процесс запускает дозагрузку и заново
        отсчитывает сутки до планового прогона (ADR-0004, §3, §9).
      operationId: refreshExchangeRates
      responses:
        "200":
          description: Обновлено (или использован последний успешный курс при ошибке Frankfurter)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LatestExchangeRates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: >
            Frankfurter недоступен или не удалось обновить курсы пар либо список доступных
            валют (источник не ответил, список пуст или неразборчив, список не удалось
            сохранить); возвращены последние известные курсы.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LatestExchangeRates" }

  # ---------- Reporting ----------
  /reporting/total-amount:
    get:
      tags: [Reporting]
      summary: Общая сумма — текущая или на дату (UC-19, UC-21)
      operationId: getTotalAmount
      description: >
        Курсы берутся только из БД, к Frankfurter запрос не обращается (ADR-0004, §8).
        Для даты используется курс на эту дату или ближайший более ранний; ratesAsOfDate —
        фактически примененная дата. Если подходящего курса нет (в том числе пока история
        курсов не дозагружена), кошелек исключается из суммы с указанием причины в
        excludedWallets.
      parameters:
        - name: date
          in: query
          description: Без параметра — текущая сумма (UC-19); с параметром — историческая (UC-21).
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotalAmount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Нет основного кошелька (общую сумму считать не к чему).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
      # 404 здесь — штатный случай (нет основного кошелька), не только "запись не найдена по
      # id"; схема ответа та же, что у components/responses/NotFound (application/problem+json,
      # Problem), описание переопределено под конкретный смысл этого эндпоинта.

  # ---------- Audit ----------
  /audit-entries:
    get:
      tags: [Audit]
      summary: История изменений записи (UC-25)
      operationId: listAuditEntries
      parameters:
        - name: entityType
          in: query
          required: true
          schema: { type: string }
        - name: entityId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK, отсортировано по occurred_at по убыванию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- Planning (ADR-0010 §6) ----------
  /planned-transactions:
    get:
      tags: [Planning]
      summary: Список плановых операций (issue #9)
      operationId: listPlannedTransactions
      description: Порядок — по моменту создания. Без status — активные и завершенные.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [Active, Finished] }
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedTransactionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Planning]
      summary: Создать плановую операцию — разовую или повторяющуюся (issue #9)
      operationId: createPlannedTransaction
      description: >
        Тип операции — активный, с поведением Income или Expense (плановые переводы в объем
        не входят); направление плана берется из типа. Валюта — активная. Кошелек необязателен,
        если указан — в валюте плана. До исполнения план не меняет ни баланс, ни историю баланса.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlannedTransactionWriteRequest" }
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /planned-transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Planning]
      summary: Получить плановую операцию
      operationId: getPlannedTransaction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedTransaction" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Planning]
      summary: Редактировать плановую операцию
      operationId: updatePlannedTransaction
      description: >
        Все поля передаются полностью (как в остальных PATCH). Отклонения наступлений, которых
        нет в новом расписании, удаляются. Если у плана есть исполнения: валюту и направление
        (доход/расход) менять нельзя, и каждое исполненное наступление должно остаться в новом
        расписании — иначе 409. Неактивный тип операции допустим, только если он не меняется.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlannedTransactionWriteRequest" }
      responses:
        "200":
          description: Обновлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedTransaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: План завершен; либо смена валюты, направления или расписания противоречит исполнениям.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [Planning]
      summary: Удалить плановую операцию (ADR-0010, §8)
      operationId: deletePlannedTransaction
      description: >
        План без исполнений удаляется физически (204) вместе с отклонениями. План с исполнениями
        не удаляется, а завершается (200 с планом в статусе Finished; уже завершенный остается как есть).
      responses:
        "200":
          description: У плана есть исполнения — он завершен, а не удален
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedTransaction" }
        "204": { description: Удалена }
        "404": { $ref: "#/components/responses/NotFound" }

  /planned-transactions/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Planning]
      summary: Завершить плановую операцию
      operationId: finishPlannedTransaction
      description: >
        Завершенный план больше ничего не ожидает: его наступления не попадают в ожидаемые
        и в прогноз; в списке наступлений остаются только исполненные (полностью или частично).
        Изменять завершенный план и его наступления нельзя.
      responses:
        "200":
          description: Завершена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedTransaction" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: План уже завершен.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /planned-occurrences:
    get:
      tags: [Planning]
      summary: Наступления плановых операций за период
      operationId: listPlannedOccurrences
      description: >
        Наступления вычисляются из правила повторения и не хранятся (ADR-0010, §6). В период
        попадает наступление, чья фактическая дата (effectiveDate, после переноса) в [from, to]:
        перенос может ввести наступление в период или вывести из него. Исполненная сумма берется
        из текущих данных операций исполнения: мягко удаленная операция не учитывается
        (наступление снова ожидается), восстановленная — учитывается снова. Порядок — по
        effectiveDate. Без пагинации: период ограничен 731 днем.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: plannedTransactionId
          in: query
          description: Только наступления этого плана.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedOccurrenceList" }
        "400":
          description: Не указан from или to, from позже to либо период длиннее 731 дня.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /planned-transactions/{id}/occurrences/{date}/skip:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - $ref: "#/components/parameters/OccurrenceDateParam"
    post:
      tags: [Planning]
      summary: Пропустить наступление
      operationId: skipPlannedOccurrence
      description: >
        Пропущенное наступление больше не ожидается (в том числе остаток частично исполненного).
        Повторный пропуск ничего не меняет.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedOccurrence" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: План завершен либо наступление уже исполнено полностью.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /planned-transactions/{id}/occurrences/{date}/unskip:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - $ref: "#/components/parameters/OccurrenceDateParam"
    post:
      tags: [Planning]
      summary: Отменить пропуск наступления
      operationId: unskipPlannedOccurrence
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedOccurrence" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: План завершен либо наступление не пропущено.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /planned-transactions/{id}/occurrences/{date}/move:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - $ref: "#/components/parameters/OccurrenceDateParam"
    post:
      tags: [Planning]
      summary: Перенести наступление на другую дату
      operationId: movePlannedOccurrence
      description: Перенос на исходную дату отменяет перенос. Ограничений на новую дату нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedOccurrence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: План завершен.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /planned-transactions/{id}/occurrences/{date}/amount:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - $ref: "#/components/parameters/OccurrenceDateParam"
    put:
      tags: [Planning]
      summary: Изменить сумму одного наступления
      operationId: changePlannedOccurrenceAmount
      description: amount = null (или сумма плана) возвращает наступление к сумме плана.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: [string, "null"], format: decimal }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedOccurrence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: План завершен.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /planned-transactions/{id}/occurrences/{date}/execute:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - $ref: "#/components/parameters/OccurrenceDateParam"
    post:
      tags: [Planning]
      summary: Исполнить наступление — создать обычную операцию
      operationId: executePlannedOccurrence
      description: >
        В одной транзакции создается обычная операция дохода/расхода (как POST /operations:
        баланс, история баланса, корректирующие суммы, аудит) и связывается с наступлением.
        По умолчанию: кошелек плана, сумма — остаток ожидаемой, дата операции — фактическая
        дата наступления. Кошелек — в валюте плана; дата — в [accountingStartDate кошелька ..
        сегодня]. Сумма меньше остатка — частичное исполнение: остаток по-прежнему ожидается;
        больше остатка допустима, наступление считается исполненным. Описание плана в операцию
        не переносится (у операции нет описания). Параллельные команды по одному плану
        выполняются по очереди (блокировка строки плана).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlannedOccurrenceExecuteRequest" }
      responses:
        "201":
          description: Операция создана; Location — /operations/{operationId}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedOccurrenceExecutionResult" }
        "400":
          description: >
            Нет кошелька ни в плане, ни в запросе; кошелек не найден или в другой валюте; дата
            операции вне допустимого диапазона (в том числе будущая фактическая дата по умолчанию);
            сумма не положительна; тип операции деактивирован.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: План завершен; наступление пропущено или уже исполнено полностью.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------- Debts (ADR-0010 §3) ----------
  /creditors:
    get:
      tags: [Creditors]
      summary: Список кредиторов (по названию)
      operationId: listCreditors
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditorPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Creditors]
      summary: Добавить кредитора
      operationId: createCreditor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditorRequest" }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Creditor" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /creditors/{id}:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    patch:
      tags: [Creditors]
      summary: Переименовать кредитора
      operationId: renameCreditor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditorRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Creditor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Creditors]
      summary: Удалить неиспользуемого кредитора (ADR-0002 §4)
      operationId: deleteCreditor
      responses:
        "204": { description: Удален }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Кредитор используется долгом или кредитом (включая отменённые) — используйте деактивацию.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /creditors/{id}/deactivate:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [Creditors]
      summary: Деактивировать кредитора (нельзя выбрать в новом или изменяемом долге/кредите)
      operationId: deactivateCreditor
      responses:
        "200":
          description: Деактивирован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Creditor" }
        "404": { $ref: "#/components/responses/NotFound" }

  /debts:
    get:
      tags: [Debts]
      summary: Список долгов (по дате создания)
      operationId: listDebts
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: creditorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebtPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Debts]
      summary: Завести долг (#6). Операция не создаётся (ADR-0010, В3)
      operationId: createDebt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebtCreateRequest" }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Debt" }
        "400":
          description: Нет обязательного поля, сумма ≤ 0, кредитор не найден или деактивирован, валюта не активна.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /debts/summary:
    get:
      tags: [Debts]
      summary: Общий долг и разбивка по кредиторам (#6), по валютам
      description: >
        Учитываются неотменённые долги с остатком > 0. Суммы сгруппированы по валюте долга;
        пересчёт в валюту основного кошелька — задача Reporting (ADR-0010 §7), здесь не выполняется.
      operationId: getDebtSummary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebtSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /debts/{id}:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    get:
      tags: [Debts]
      summary: Долг с историей погашений
      operationId: getDebt
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Debt" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Debts]
      summary: Изменить долг (кредитор, название, исходная сумма, дата). Валюта неизменна
      operationId: updateDebt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebtUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Debt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Debts]
      summary: Удалить долг без погашений (ADR-0010 §8)
      operationId: deleteDebt
      responses:
        "204": { description: Удален }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: По долгу есть погашения (включая погашения удалённых операций) — используйте отмену.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /debts/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [Debts]
      summary: Отменить долг (конечный статус Cancelled)
      operationId: cancelDebt
      responses:
        "200":
          description: Отменён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Debt" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /debts/{id}/repayments:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [Debts]
      summary: Зафиксировать погашение (частичное или полное) расходом из кошелька (ADR-0010, В4)
      description: >
        В одной транзакции создаёт обычную операцию расхода (через Operations — баланс, история,
        аудит как у POST /operations) и связывает её с долгом. Мягкое удаление этой операции
        исключает погашение из расчёта, восстановление — возвращает.
      operationId: recordDebtRepayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCreateRequest" }
      responses:
        "201":
          description: Погашение зафиксировано; в ответе — долг с обновлённым остатком
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Debt" }
        "400":
          description: >
            Нет обязательного поля; сумма ≤ 0; кошелёк или тип операции не найден; тип операции
            деактивирован или не «Расход»; дата вне [дата начала учёта кошелька .. сегодня].
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Долг отменён; остаток равен нулю; сумма больше остатка; валюта кошелька ≠ валюте долга.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /loans:
    get:
      tags: [Loans]
      summary: Список кредитов (по дате создания)
      operationId: listLoans
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: creditorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Loans]
      summary: Завести кредит (#8). Операция не создаётся (ADR-0010, В3)
      operationId: createLoan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanCreateRequest" }
      responses:
        "201":
          description: Создан (график пуст)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /loans/{id}:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    get:
      tags: [Loans]
      summary: Кредит с графиком, статусами пунктов, ближайшим платежом и платежами
      operationId: getLoan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Loans]
      summary: Изменить условия кредита (кредитор, название, сумма к погашению, дата начала). Валюта неизменна
      operationId: updateLoan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Loans]
      summary: Удалить кредит без платежей (график удаляется вместе с ним, ADR-0010 §8)
      operationId: deleteLoan
      responses:
        "204": { description: Удален }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: По кредиту есть платежи — используйте отмену.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /loans/{id}/schedule:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    put:
      tags: [Loans]
      summary: Заменить график целиком (перенос даты, изменение сумм, добавление/удаление пунктов)
      description: >
        Сумма графика не обязана совпадать с суммой к погашению — расхождение видно по
        scheduledAmount. Пункты с одной датой допускаются и упорядочиваются в порядке ввода.
      operationId: replaceLoanSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanScheduleReplaceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400":
          description: Нет обязательного поля пункта или сумма пункта ≤ 0.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /loans/{id}/schedule/generate:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [Loans]
      summary: Сгенерировать график из N равных ежемесячных платежей (заменяет текущий)
      description: >
        Платёж = сумма к погашению / N, округлённая вниз до 2 знаков; последний платёж
        получает остаток, так что сумма графика равна сумме к погашению. Даты — ежемесячно
        от firstPaymentDate; если числа нет в месяце — последний день месяца.
      operationId: generateLoanSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanScheduleGenerateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400":
          description: N вне [1..600] или платёж после округления равен нулю.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /loans/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [Loans]
      summary: Отменить кредит (конечный статус Cancelled)
      operationId: cancelLoan
      responses:
        "200":
          description: Отменён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /loans/{id}/payments:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [Loans]
      summary: Зафиксировать платёж по кредиту расходом из кошелька (ADR-0010, В4)
      description: >
        В одной транзакции создаёт операцию расхода и связывает её с кредитом. Учтённые платежи
        закрывают самые ранние неоплаченные пункты графика.
      operationId: recordLoanPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCreateRequest" }
      responses:
        "201":
          description: Платёж зафиксирован; в ответе — кредит с пересчитанным графиком
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400":
          description: Как у POST /debts/{id}/repayments.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Кредит отменён; остаток равен нулю; сумма больше остатка; валюта кошелька ≠ валюте кредита.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------- Budgeting (ADR-0010 §5) ----------
  /expense-categories:
    get:
      tags: [ExpenseCategories]
      summary: Список категорий расходов
      operationId: listExpenseCategories
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK, отсортировано по названию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategoryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ExpenseCategories]
      summary: Добавить категорию расходов
      operationId: createExpenseCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseCategoryCreateRequest" }
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategory" }
        "400":
          description: >
            Пустое или длинное (более 200 символов) название; тип операции не найден,
            деактивирован или не является расходом.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: >
            Тип операции уже входит в другую категорию; активная категория с таким
            названием (без учета регистра) уже есть.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /expense-categories/{id}:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    get:
      tags: [ExpenseCategories]
      summary: Категория расходов
      operationId: getExpenseCategory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategory" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [ExpenseCategories]
      summary: Переименовать категорию и/или заменить набор ее типов операций
      operationId: updateExpenseCategory
      description: >
        Отсутствующее поле не меняется. operationTypeIds — полный новый набор. Тип, уже
        входящий в категорию, можно оставить, даже если он деактивирован; новый тип должен
        быть активным расходом. Состав категории применяется ко всем бюджетам, включая
        прошлые месяцы: исполнение считается при запросе по текущему составу.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseCategoryUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [ExpenseCategories]
      summary: Удалить неиспользуемую категорию расходов
      operationId: deleteExpenseCategory
      responses:
        "204": { description: Удалена }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Категория используется в лимите бюджета — используйте деактивацию.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /expense-categories/{id}/deactivate:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    post:
      tags: [ExpenseCategories]
      summary: Деактивировать категорию расходов
      operationId: deactivateExpenseCategory
      description: >
        Категория скрывается из списка по умолчанию, новый лимит по ней задать нельзя;
        существующие лимиты и ее типы операций сохраняются (тип остается занятым ею).
      responses:
        "200":
          description: Деактивирована (повторный вызов — без изменений)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseCategory" }
        "404": { $ref: "#/components/responses/NotFound" }

  /budgets:
    get:
      tags: [Budgets]
      summary: Список бюджетов
      operationId: listBudgets
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: month
          in: query
          description: Фильтр по месяцу ГГГГ-ММ.
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$", example: "2026-10" }
      responses:
        "200":
          description: OK, по месяцу по убыванию, затем по времени создания
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Budgets]
      summary: Создать бюджет на месяц в валюте
      operationId: createBudget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCreateRequest" }
      responses:
        "201":
          description: Создан (без лимитов)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400":
          description: Месяц не в формате ГГГГ-ММ; валюта не найдена среди активных.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Бюджет на этот месяц в этой валюте уже есть.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /budgets/{id}:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    get:
      tags: [Budgets]
      summary: Бюджет с лимитами
      operationId: getBudget
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Budgets]
      summary: Удалить бюджет вместе с лимитами
      operationId: deleteBudget
      responses:
        "204": { description: Удален }
        "404": { $ref: "#/components/responses/NotFound" }

  /budgets/{id}/limits/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Budgets]
      summary: Задать или изменить лимит категории
      operationId: setBudgetCategoryLimit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetLimitRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400":
          description: Лимит не указан или меньше нуля; категория не найдена или деактивирована.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Budgets]
      summary: Убрать лимит категории
      operationId: removeBudgetCategoryLimit
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "404":
          description: Бюджет не найден или в нем нет лимита по категории.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /budgets/{id}/execution:
    parameters: [{ $ref: "#/components/parameters/IdParam" }]
    get:
      tags: [Budgets]
      summary: Исполнение бюджета
      operationId: getBudgetExecution
      description: >
        Факт по категории — сумма не удаленных расходов (поведение «Расход») ее типов
        операций с датой в месяце, по всем кошелькам; корректирующие суммы и переводы не
        учитываются. Операция в другой валюте пересчитывается по историческому курсу на
        дату операции, при его отсутствии — по ближайшему более раннему (В8, ADR-0004 §8);
        если пары «валюта → валюта бюджета» в истории нет, используется обратная пара.
        Если курса нет совсем, операция не входит в суммы и перечисляется в
        excludedOperations с причиной. Курсы читаются только из БД. Остаток = лимит − факт,
        превышение — отрицательный остаток. Перенос остатка между месяцами не делается.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetExecution" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Funds (ADR-0010 §4) ----------
  /funds:
    get:
      tags: [Funds]
      summary: Список фондов (по времени создания)
      operationId: listFunds
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: includeClosed
          in: query
          description: Включать закрытые фонды. По умолчанию — только активные.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundPage" }
    post:
      tags: [Funds]
      summary: Создать фонд
      operationId: createFund
      description: >
        Фонд в одной валюте (ADR-0010, В6); валюта — активная (GET /currencies).
        Связь с долгом или кредитом необязательна, указывается не более одной;
        существование долга/кредита пока не проверяется.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundCreateRequest" }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fund" }
        "400":
          description: >
            Пустое или длиннее 200 символов название, целевая сумма не указана или не больше нуля,
            валюта не активна, указаны одновременно долг и кредит.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /funds/{fundId}:
    parameters:
      - $ref: "#/components/parameters/FundIdParam"
    get:
      tags: [Funds]
      summary: Получить фонд
      operationId: getFund
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fund" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Funds]
      summary: Изменить фонд (все поля передаются целиком)
      operationId: updateFund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundUpdateRequest" }
      responses:
        "200":
          description: Обновлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fund" }
        "400":
          description: Те же проверки, что при создании.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Фонд закрыт; смена валюты фонда, по которому уже были резервы (даже снятые);
            параллельное изменение фонда.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [Funds]
      summary: Удалить фонд без истории резервов
      operationId: deleteFund
      responses:
        "204": { description: Удален }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: По фонду уже были резервы — фонд не удаляется, а закрывается (ADR-0010, §8).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /funds/{fundId}/close:
    parameters:
      - $ref: "#/components/parameters/FundIdParam"
    post:
      tags: [Funds]
      summary: Закрыть фонд — снимает все резервы
      operationId: closeFund
      description: Закрытие окончательно; закрытый фонд нельзя изменить, пополнить или открыть снова.
      responses:
        "200":
          description: Закрыт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fund" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Фонд уже закрыт.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /funds/{fundId}/reserve:
    parameters:
      - $ref: "#/components/parameters/FundIdParam"
    post:
      tags: [Funds]
      summary: Зарезервировать деньги кошелька в фонде (создать или увеличить аллокацию)
      operationId: reserveFund
      description: >
        Баланс кошелька не меняется. Сумма не больше свободных средств кошелька =
        текущий баланс − резервы всех активных фондов по этому кошельку (ADR-0010, В7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundAllocationRequest" }
      responses:
        "200":
          description: Зарезервировано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fund" }
        "400":
          description: Сумма не указана или не больше нуля; кошелек не найден; валюта кошелька не совпадает с валютой фонда.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Недостаточно свободных средств (type
            https://lupexwallet/errors/fund-insufficient-free-funds, в detail — доступная сумма);
            кошелек архивный; фонд закрыт; параллельное изменение.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /funds/{fundId}/release:
    parameters:
      - $ref: "#/components/parameters/FundIdParam"
    post:
      tags: [Funds]
      summary: Снять резерв фонда с кошелька (уменьшить аллокацию)
      operationId: releaseFund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundAllocationRequest" }
      responses:
        "200":
          description: Резерв снят
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fund" }
        "400":
          description: Сумма не указана или не больше нуля.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Сумма больше резерва фонда по этому кошельку; фонд закрыт; параллельное изменение.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /funds/wallet-reservations:
    get:
      tags: [Funds]
      summary: Резервы по всем кошелькам — баланс, зарезервировано, свободно, дефицит
      operationId: listWalletReservations
      description: >
        Все кошельки, включая архивные (у архивного резерв всегда 0). Без пагинации:
        список кошельков небольшой и нужен целиком (как GET /currencies/available).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WalletReservation" }

  /funds/wallet-reservations/{walletId}:
    parameters:
      - $ref: "#/components/parameters/WalletIdParam"
    get:
      tags: [Funds]
      summary: Резервы одного кошелька
      operationId: getWalletReservation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletReservation" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    WalletIdParam:
      name: walletId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationIdParam:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FundIdParam:
      name: fundId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OccurrenceDateParam:
      name: date
      in: path
      required: true
      description: Исходная дата наступления по расписанию (occurrenceDate), в том числе после переноса.
      schema: { type: string, format: date }
    CursorParam:
      name: cursor
      in: query
      description: Непрозрачный курсор для постраничной навигации.
      schema: { type: string }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100, minimum: 1 }

  schemas:
    # ---- Общие ----
    Money:
      type: object
      required: [amount, currencyId]
      properties:
        amount:
          type: string
          format: decimal
          description: Произвольная точность (ADR-0005); передается строкой, чтобы не терять точность в JSON-числах.
          example: "1234.56789012"
        currencyId: { type: string, format: uuid }
        currencyCode: { type: string, readOnly: true, example: "USD" }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    CursorPageMeta:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }

    # ---- Auth ----
    LoginRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    # ---- Wallets ----
    Wallet:
      type: object
      required:
        [id, name, walletTypeId, currencyId, initialBalance, accountingStartDate,
         currentBalance, includeInTotal, isPrimary, isArchived, displayOrder,
         createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        walletTypeId: { type: string, format: uuid }
        purposeDescription: { type: [string, "null"] }
        currencyId: { type: string, format: uuid }
        initialBalance: { $ref: "#/components/schemas/Money" }
        accountingStartDate: { type: string, format: date }
        currentBalance: { $ref: "#/components/schemas/Money", readOnly: true }
        includeInTotal: { type: boolean }
        isPrimary: { type: boolean, readOnly: true, description: "Меняется только через POST /wallets/{id}/set-primary" }
        isArchived: { type: boolean, readOnly: true }
        displayOrder: { type: integer }
        color: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    WalletCreateRequest:
      type: object
      required: [name, walletTypeId, currencyCode, initialBalanceAmount, accountingStartDate]
      properties:
        name: { type: string, maxLength: 200 }
        walletTypeId: { type: string, format: uuid }
        purposeDescription: { type: [string, "null"] }
        currencyCode:
          type: string
          maxLength: 16
          example: "USD"
          description: >
            Код активной или доступной валюты; доступная неактивная валюта становится
            активной при создании кошелька (ADR-0004, §7).
        initialBalanceAmount: { type: string, format: decimal }
        accountingStartDate: { type: string, format: date }
        includeInTotal: { type: boolean, default: true }
        displayOrder: { type: integer, default: 0 }
        color: { type: [string, "null"] }
        icon: { type: [string, "null"] }
    WalletUpdateRequest:
      type: object
      required: [name, walletTypeId, includeInTotal, displayOrder]
      properties:
        name: { type: string, maxLength: 200 }
        walletTypeId: { type: string, format: uuid }
        purposeDescription: { type: [string, "null"] }
        includeInTotal:
          type: boolean
          description: Игнорируется (остается true), если кошелек основной (Q8).
        displayOrder: { type: integer }
        color: { type: [string, "null"] }
        icon: { type: [string, "null"] }
    WalletChangeCurrencyRequest:
      type: object
      required: [currencyId]
      properties:
        currencyId: { type: string, format: uuid }
    WalletPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Wallet" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    # ---- Reference data ----
    ReferenceItem:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        isActive: { type: boolean, readOnly: true }
    ReferenceItemCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
    ReferenceItemPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ReferenceItem" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    OperationBehaviorKind:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code:
          type: string
          enum: [Income, Expense, Transfer, Adjustment]
        name: { type: string }

    OperationType:
      type: object
      required: [id, name, behaviorKindId, isActive]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        behaviorKindId: { type: string, format: uuid }
        isActive: { type: boolean, readOnly: true }
    OperationTypeCreateRequest:
      type: object
      required: [name, behaviorKindId]
      properties:
        name: { type: string, maxLength: 200 }
        behaviorKindId: { type: string, format: uuid }
    OperationTypePage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/OperationType" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    Currency:
      type: object
      description: Активная валюта пользователя.
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, maxLength: 16, example: "USD" }
        name: { type: string, maxLength: 200, example: "United States Dollar" }
    CurrencyCreateRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
          example: "USD"
          description: Код из списка доступных валют (GET /currencies/available).
    AvailableCurrency:
      type: object
      description: Валюта из списка сервиса курсов.
      required: [code, name, isActive]
      properties:
        code: { type: string, maxLength: 16, example: "EUR" }
        name: { type: string, maxLength: 200, example: "Euro" }
        isActive: { type: boolean, description: "Валюта уже добавлена в активные." }
    CurrencyPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Currency" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    # ---- Operations ----
    Operation:
      type: object
      description: >
        Операция кошелька: обычная (доход, расход, корректировка дельтой, нога перевода)
        либо корректирующая сумма — системная запись, которую создает и пересчитывает
        система для заявленного баланса (ADR-0003, §6). Корректирующая сумма отличается
        признаком isCorrection = true; у нее нет типа операции и режима корректировки.
        Название корректирующей суммы в ответе не передается — клиент выводит его по знаку
        amount: «Неизвестные траты» (amount меньше нуля) или «Неизвестные доходы»
        (amount больше нуля). Корректирующая сумма не подлежит мягкому удалению
        (isDeleted всегда false), не редактируется и не восстанавливается (409).
      required: [id, walletId, operationTypeId, amount, operationDate, isCorrection, statedBalance, isDeleted, deletedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        walletId: { type: string, format: uuid }
        operationTypeId:
          type: [string, "null"]
          format: uuid
          description: >
            Тип операции. null только у корректирующей суммы (isCorrection = true);
            у остальных операций заполнен всегда.
        amount:
          $ref: "#/components/schemas/Money"
          description: >
            Сумма операции. У корректирующей суммы — рассчитанная системой сумма со знаком
            (заявленный баланс минус баланс на конец дня operationDate без этой суммы);
            пересчитывается при любом изменении операций кошелька, влияющем на этот день.
        operationDate: { type: string, format: date }
        adjustmentMode:
          type: [string, "null"]
          enum: [Delta, null]
          description: >
            Заполнено только когда operationType ссылается на behaviorKind = Adjustment (Q3):
            Delta — сумма изменения баланса, введенная пользователем (ADR-0003, §6, п.9).
            У корректирующей суммы и у операций других видов — null. Новое значение
            баланса на дату задается не операцией, а PUT /wallets/{walletId}/stated-balances/{date}.
        isCorrection:
          type: boolean
          readOnly: true
          description: >
            Корректирующая сумма заявленного баланса (ADR-0003, §6). Системная запись:
            PATCH, DELETE и restore для нее возвращают 409.
        statedBalance:
          readOnly: true
          description: >
            Заявленный баланс X на конец дня operationDate — значение, введенное пользователем
            (ADR-0003, §6, п.1). Заполнено только у корректирующей суммы; у остальных операций null.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        transferId: { type: [string, "null"], format: uuid, readOnly: true }
        isDeleted:
          type: boolean
          readOnly: true
          description: Мягко удалена (ADR-0002, §3). Удаленная операция остается в списках, не участвует в расчетах, не редактируется до восстановления.
        deletedAt:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: Момент мягкого удаления; null, если операция не удалена. Для ног перевода совпадает с deletedAt перевода.
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    OperationCreateRequest:
      type: object
      required: [walletId, operationTypeId, amount, operationDate]
      properties:
        walletId: { type: string, format: uuid }
        operationTypeId: { type: string, format: uuid }
        amount: { type: string, format: decimal }
        operationDate: { type: string, format: date }
        adjustmentMode:
          type: string
          enum: [Delta]
          description: >
            Единственный режим корректировки — Delta (сумма изменения баланса со знаком,
            ADR-0003, §6, п.9). Значение Absolute не поддерживается: запрос отклоняется
            с 400. Новое значение баланса на дату задается через
            PUT /wallets/{walletId}/stated-balances/{date}.
    OperationUpdateRequest:
      type: object
      properties:
        walletId:
          type: string
          format: uuid
          description: >
            Кошелек операции (UC-13, решение пользователя от 2026-09-11). Если отличается
            от текущего WalletId операции — операция переносится на другой кошелек: дельта
            реверсируется на исходном кошельке и заново применяется на новом (с учетом его
            валюты и AccountingStartDate). Недоступно для операций — частей перевода (409).
        operationTypeId: { type: string, format: uuid }
        amount: { type: string, format: decimal }
        operationDate: { type: string, format: date }
        adjustmentMode:
          type: string
          enum: [Delta]
          description: >
            Единственный режим корректировки — Delta. Значение Absolute не поддерживается:
            запрос отклоняется с 400. Новое значение баланса на дату задается через
            PUT /wallets/{walletId}/stated-balances/{date}.
    StatedBalanceRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          format: decimal
          description: >
            Заявленный баланс кошелька на конец дня из пути запроса (ADR-0003, §6, п.1, п.4)
            в валюте кошелька. Отрицательное значение допустимо.
          example: "350.00"
    OperationPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    # ---- Transfers ----
    Transfer:
      type: object
      required: [id, sourceWalletId, targetWalletId, sourceOperationId, targetOperationId, amount, transferDate, isDeleted, deletedAt, createdAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        sourceWalletId: { type: string, format: uuid }
        targetWalletId: { type: string, format: uuid }
        sourceOperationId: { type: string, format: uuid, readOnly: true }
        targetOperationId: { type: string, format: uuid, readOnly: true }
        amount: { $ref: "#/components/schemas/Money" }
        transferDate: { type: string, format: date }
        isDeleted:
          type: boolean
          readOnly: true
          description: Мягко удален вместе с обеими ногами (ADR-0002, §3).
        deletedAt:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: Момент мягкого удаления; null, если перевод не удален.
        createdAt: { type: string, format: date-time, readOnly: true }
    TransferCreateRequest:
      type: object
      required: [sourceWalletId, targetWalletId, amount, transferDate]
      properties:
        sourceWalletId: { type: string, format: uuid }
        targetWalletId: { type: string, format: uuid }
        amount: { type: string, format: decimal }
        transferDate: { type: string, format: date }
    TransferPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Transfer" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    # ---- Balance history ----
    BalanceSnapshot:
      type: object
      required: [walletId, date, balance]
      properties:
        walletId: { type: string, format: uuid }
        date: { type: string, format: date }
        balance: { $ref: "#/components/schemas/Money" }
    BalanceSnapshotPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/BalanceSnapshot" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    # ---- Exchange rates ----
    ExchangeRateQuote:
      type: object
      required: [fromCurrencyId, toCurrencyId, rate]
      properties:
        fromCurrencyId: { type: string, format: uuid }
        toCurrencyId: { type: string, format: uuid }
        rate: { type: string, format: decimal }
    LatestExchangeRates:
      type: object
      required: [lastSuccessfulUpdate, rates]
      properties:
        lastSuccessfulUpdate:
          type: [string, "null"]
          format: date-time
          description: null, если ни одно обновление еще не было успешным.
        rates:
          type: array
          items: { $ref: "#/components/schemas/ExchangeRateQuote" }

    # ---- Reporting ----
    TotalAmount:
      type: object
      required: [amount, ratesAsOfDate, excludedWallets]
      properties:
        date:
          type: [string, "null"]
          format: date
          description: Запрошенная дата; null означает «текущая сумма» (UC-19).
        amount: { $ref: "#/components/schemas/Money" }
        ratesAsOfDate:
          type: string
          format: date
          description: >-
            Дата курса, реально примененного при конвертации (может отличаться от запрошенной,
            если точного курса нет — раздел 5). Если применены курсы на разные даты — самая
            ранняя из них; для текущей суммы — сегодняшняя дата.
        excludedWallets:
          type: array
          description: >-
            Кошельки, исключенные из amount из-за отсутствия курса для их валюты
            (валюта не поддерживается источником курсов, либо история курсов еще не загружена —
            ADR-0004, §9): исключение из суммы с явной пометкой является основным путем, не
            запасным; не 409, не курс 1:1.
          items: { $ref: "#/components/schemas/ExcludedWallet" }
    ExcludedWallet:
      type: object
      required: [walletId, reason]
      properties:
        walletId: { type: string, format: uuid }
        reason: { type: string, description: "Человекочитаемая причина исключения кошелька из суммы; для отсутствующего курса содержит код валюты (и дату для исторической суммы)." }

    # ---- Audit ----
    AuditFieldChange:
      type: object
      required: [field]
      properties:
        field: { type: string }
        oldValue: { type: [string, "null"] }
        newValue: { type: [string, "null"] }
    AuditEntry:
      type: object
      required: [id, entityType, entityId, action, occurredAt, actorKind]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        action: { type: string }
        occurredAt: { type: string, format: date-time }
        actorKind: { type: string, enum: [User, System] }
        actorSystemProcess: { type: [string, "null"] }
        changes:
          type: array
          items: { $ref: "#/components/schemas/AuditFieldChange" }
    AuditEntryPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    # ---- Planning (ADR-0010 §6) ----
    Recurrence:
      type: object
      required: [frequency]
      description: >
        Правило повторения. День недели/месяца/года берется из startDate; для Monthly при
        отсутствии числа в месяце — последний день месяца (31 янв → 28/29 фев → 31 мар), для
        Yearly 29 февраля в невисокосный год — 28 февраля. until и count взаимоисключающие.
      properties:
        frequency: { type: string, enum: [Daily, Weekly, Monthly, Yearly] }
        interval: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        until: { type: [string, "null"], format: date, description: "Последняя возможная дата наступления (включительно)." }
        count: { type: [integer, "null"], minimum: 1, description: "Всего наступлений, включая первое." }
    PlannedTransactionWriteRequest:
      type: object
      required: [operationTypeId, amount, currencyId, startDate]
      properties:
        operationTypeId: { type: string, format: uuid }
        amount: { type: string, format: decimal, description: "Положительная; направление — из типа операции." }
        currencyId: { type: string, format: uuid }
        walletId: { type: [string, "null"], format: uuid }
        description: { type: [string, "null"], maxLength: 500 }
        startDate: { type: string, format: date, description: "Дата первого наступления." }
        recurrence:
          description: null — разовая операция.
          oneOf:
            - $ref: "#/components/schemas/Recurrence"
            - type: "null"
    PlannedTransaction:
      type: object
      required: [id, operationTypeId, direction, amount, startDate, status, hasExecutions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        operationTypeId: { type: string, format: uuid }
        direction: { type: string, enum: [Income, Expense], readOnly: true }
        amount: { $ref: "#/components/schemas/Money" }
        walletId:
          type: [string, "null"]
          format: uuid
          description: Сбрасывается в null, если кошелек удален или сменил валюту.
        description: { type: [string, "null"] }
        startDate: { type: string, format: date }
        recurrence:
          oneOf:
            - $ref: "#/components/schemas/Recurrence"
            - type: "null"
        status: { type: string, enum: [Active, Finished], readOnly: true }
        hasExecutions: { type: boolean, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        finishedAt: { type: [string, "null"], format: date-time, readOnly: true }
    PlannedTransactionPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PlannedTransaction" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }
    PlannedOccurrenceExecution:
      type: object
      required: [operationId, amount, isOperationDeleted, executedAt]
      properties:
        operationId: { type: string, format: uuid }
        amount:
          description: Учтенная сумма — текущая сумма операции, 0 для мягко удаленной.
          allOf:
            - $ref: "#/components/schemas/Money"
        isOperationDeleted: { type: boolean }
        executedAt: { type: string, format: date-time }
    PlannedOccurrence:
      type: object
      required:
        [plannedTransactionId, occurrenceDate, effectiveDate, operationTypeId, direction, plannedAmount,
         executedAmount, expectedAmount, status, isOverdue, isMoved, isAmountChanged, executions]
      properties:
        plannedTransactionId: { type: string, format: uuid }
        occurrenceDate: { type: string, format: date, description: "Исходная дата по расписанию — идентификатор наступления в путях." }
        effectiveDate: { type: string, format: date, description: "Фактическая дата (после переноса)." }
        operationTypeId: { type: string, format: uuid }
        direction: { type: string, enum: [Income, Expense] }
        walletId: { type: [string, "null"], format: uuid }
        description: { type: [string, "null"] }
        plannedAmount:
          description: Сумма плана или измененная сумма наступления.
          allOf:
            - $ref: "#/components/schemas/Money"
        executedAmount: { $ref: "#/components/schemas/Money" }
        expectedAmount:
          description: Еще ожидается — plannedAmount − executedAmount; 0 для пропущенного, исполненного и наступления завершенного плана.
          allOf:
            - $ref: "#/components/schemas/Money"
        status: { type: string, enum: [Expected, PartiallyExecuted, Executed, Skipped] }
        isOverdue: { type: boolean, description: "effectiveDate раньше сегодняшнего дня (UTC), а наступление еще ожидается." }
        isMoved: { type: boolean }
        isAmountChanged: { type: boolean }
        executions: { type: array, items: { $ref: "#/components/schemas/PlannedOccurrenceExecution" } }
    PlannedOccurrenceList:
      type: object
      required: [from, to, data]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        data: { type: array, items: { $ref: "#/components/schemas/PlannedOccurrence" } }
    PlannedOccurrenceExecuteRequest:
      type: object
      properties:
        walletId: { type: [string, "null"], format: uuid, description: "По умолчанию — кошелек плана." }
        amount: { type: [string, "null"], format: decimal, description: "По умолчанию — остаток ожидаемой суммы." }
        operationDate: { type: [string, "null"], format: date, description: "По умолчанию — фактическая дата наступления." }
    PlannedOccurrenceExecutionResult:
      type: object
      required: [occurrence, operationId]
      properties:
        occurrence: { $ref: "#/components/schemas/PlannedOccurrence" }
        operationId: { type: string, format: uuid }

    # ---- Debts (ADR-0010 §3) ----
    Creditor:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        isActive: { type: boolean }
    CreditorRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
    CreditorPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Creditor" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }
    ObligationStatus:
      type: string
      enum: [Active, Repaid, Cancelled]
      description: >
        Repaid вычисляется: учтённые платежи покрывают сумму. Если операцию платежа удалили,
        статус возвращается в Active. Cancelled — конечный статус.
    Payment:
      type: object
      description: >
        Связь долга/кредита с операцией расхода. Сумма, дата и кошелёк берутся из операции в
        её текущем виде. isCounted = операция не удалена, остаётся расходом и в валюте долга/кредита.
      required: [id, operationId, walletId, amount, paymentDate, isCounted, isOperationDeleted, createdAt]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        paymentDate: { type: string, format: date }
        isCounted: { type: boolean }
        isOperationDeleted: { type: boolean }
        createdAt: { type: string, format: date-time }
    PaymentCreateRequest:
      type: object
      required: [walletId, operationTypeId, amount, paymentDate]
      properties:
        walletId: { type: string, format: uuid, description: Кошелёк в валюте долга/кредита }
        operationTypeId: { type: string, format: uuid, description: Активный тип операции с поведением Expense }
        amount: { type: string, format: decimal, description: "> 0 и не больше остатка" }
        paymentDate: { type: string, format: date }
    Debt:
      type: object
      required: [id, creditorId, name, currencyId, originalAmount, repaidAmount, remainingAmount, startDate, status, cancelledAt, createdAt, updatedAt, repayments]
      properties:
        id: { type: string, format: uuid }
        creditorId: { type: string, format: uuid }
        name: { type: string }
        currencyId: { type: string, format: uuid }
        originalAmount: { $ref: "#/components/schemas/Money" }
        repaidAmount: { $ref: "#/components/schemas/Money" }
        remainingAmount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: max(0, originalAmount − repaidAmount)
        startDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/ObligationStatus" }
        cancelledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        repayments: { type: array, items: { $ref: "#/components/schemas/Payment" } }
    DebtCreateRequest:
      type: object
      required: [creditorId, name, currencyId, originalAmount, startDate]
      properties:
        creditorId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        currencyId: { type: string, format: uuid }
        originalAmount: { type: string, format: decimal }
        startDate: { type: string, format: date }
    DebtUpdateRequest:
      type: object
      required: [creditorId, name, originalAmount, startDate]
      properties:
        creditorId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        originalAmount: { type: string, format: decimal }
        startDate: { type: string, format: date }
    DebtPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Debt" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }
    DebtSummary:
      type: object
      required: [currencies]
      properties:
        currencies:
          type: array
          items:
            type: object
            required: [currencyId, totalRemainingAmount, debtCount, creditors]
            properties:
              currencyId: { type: string, format: uuid }
              totalRemainingAmount: { $ref: "#/components/schemas/Money" }
              debtCount: { type: integer }
              creditors:
                type: array
                items:
                  type: object
                  required: [creditorId, creditorName, remainingAmount, debtCount]
                  properties:
                    creditorId: { type: string, format: uuid }
                    creditorName: { type: string }
                    remainingAmount: { $ref: "#/components/schemas/Money" }
                    debtCount: { type: integer }
    LoanScheduleItem:
      type: object
      required: [dueDate, amount, paidAmount, outstandingAmount, status]
      properties:
        dueDate: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        outstandingAmount: { $ref: "#/components/schemas/Money" }
        status:
          type: string
          enum: [Paid, Partial, Overdue, Expected]
          description: >
            Paid — покрыт полностью; Overdue — дата < сегодня (UTC), покрыт не полностью;
            Partial — покрыт частично, дата ≥ сегодня; Expected — не покрыт, дата ≥ сегодня.
    Loan:
      type: object
      required: [id, creditorId, name, currencyId, amountToRepay, paidAmount, remainingAmount, scheduledAmount, startDate, status, nextPayment, schedule, payments, cancelledAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        creditorId: { type: string, format: uuid }
        name: { type: string }
        currencyId: { type: string, format: uuid }
        amountToRepay: { $ref: "#/components/schemas/Money" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        remainingAmount: { $ref: "#/components/schemas/Money" }
        scheduledAmount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Сумма пунктов графика (может отличаться от amountToRepay)
        startDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/ObligationStatus" }
        nextPayment:
          oneOf: [{ $ref: "#/components/schemas/LoanScheduleItem" }, { type: "null" }]
          description: Самый ранний не полностью оплаченный пункт (включая просроченный); null у отменённого кредита
        schedule: { type: array, items: { $ref: "#/components/schemas/LoanScheduleItem" } }
        payments: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        cancelledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoanCreateRequest:
      type: object
      required: [creditorId, name, currencyId, amountToRepay, startDate]
      properties:
        creditorId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        currencyId: { type: string, format: uuid }
        amountToRepay: { type: string, format: decimal }
        startDate: { type: string, format: date }
    LoanUpdateRequest:
      type: object
      required: [creditorId, name, amountToRepay, startDate]
      properties:
        creditorId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        amountToRepay: { type: string, format: decimal }
        startDate: { type: string, format: date }
    LoanScheduleReplaceRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [dueDate, amount]
            properties:
              dueDate: { type: string, format: date }
              amount: { type: string, format: decimal }
    LoanScheduleGenerateRequest:
      type: object
      required: [firstPaymentDate, numberOfPayments]
      properties:
        firstPaymentDate: { type: string, format: date }
        numberOfPayments: { type: integer, minimum: 1, maximum: 600 }
    LoanPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Loan" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }

    # ---- Budgeting (ADR-0010 §5) ----
    ExpenseCategory:
      type: object
      required: [id, name, isActive, operationTypeIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        isActive: { type: boolean }
        operationTypeIds:
          type: array
          items: { type: string, format: uuid }
    ExpenseCategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        operationTypeIds:
          type: array
          description: Активные типы операций с поведением «Расход»; можно пусто.
          items: { type: string, format: uuid }
    ExpenseCategoryUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        operationTypeIds:
          type: array
          description: Полный новый набор типов; отсутствие поля — набор не меняется.
          items: { type: string, format: uuid }
    ExpenseCategoryPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ExpenseCategory" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }
    CategoryLimit:
      type: object
      required: [expenseCategoryId, limit]
      properties:
        expenseCategoryId: { type: string, format: uuid }
        limit: { type: string, format: decimal, description: "В валюте бюджета, не меньше нуля." }
    Budget:
      type: object
      required: [id, month, currencyId, limits, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        month: { type: string, pattern: "^\\d{4}-\\d{2}$", example: "2026-10" }
        currencyId: { type: string, format: uuid }
        limits: { type: array, items: { $ref: "#/components/schemas/CategoryLimit" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BudgetCreateRequest:
      type: object
      required: [month, currencyId]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$", example: "2026-10" }
        currencyId: { type: string, format: uuid, description: "Активная валюта." }
    BudgetLimitRequest:
      type: object
      required: [limit]
      properties:
        limit: { type: string, format: decimal, example: "15000.00" }
    BudgetPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Budget" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }
    BudgetCategoryExecution:
      type: object
      required: [expenseCategoryId, name, isActive, limit, actual, remaining, isOverspent]
      properties:
        expenseCategoryId: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }
        limit: { type: string, format: decimal }
        actual: { type: string, format: decimal, description: "Факт в валюте бюджета." }
        remaining: { type: string, format: decimal, description: "Лимит − факт; отрицательный при превышении." }
        isOverspent: { type: boolean, description: "true, если remaining < 0." }
    BudgetAppliedRate:
      type: object
      required: [fromCurrencyId, operationDate, rateDate, rate, isFallback]
      properties:
        fromCurrencyId: { type: string, format: uuid }
        operationDate: { type: string, format: date }
        rateDate: { type: string, format: date, description: "Дата примененного курса." }
        rate: { type: string, format: decimal, description: "Множитель из fromCurrencyId в валюту бюджета." }
        isFallback: { type: boolean, description: "Курса на дату операции нет — применен ближайший более ранний." }
    BudgetExcludedOperation:
      type: object
      required: [operationId, currencyId, operationDate, amount, reason]
      properties:
        operationId: { type: string, format: uuid }
        currencyId: { type: string, format: uuid }
        operationDate: { type: string, format: date }
        amount: { type: string, format: decimal, description: "Сумма в валюте операции." }
        reason: { type: string, example: "Курс валюты USD к EUR на дату 2026-10-03 недоступен." }
    BudgetExecution:
      type: object
      required: [budgetId, month, currencyId, categories, unbudgeted, totals, rateSource, appliedRates, excludedOperations]
      properties:
        budgetId: { type: string, format: uuid }
        month: { type: string, example: "2026-10" }
        currencyId: { type: string, format: uuid, description: "Валюта расчета = валюта бюджета." }
        categories:
          type: array
          description: Одна строка на каждую категорию с лимитом в этом бюджете.
          items: { $ref: "#/components/schemas/BudgetCategoryExecution" }
        unbudgeted:
          type: object
          description: >
            Строка «Без бюджета»: расходы, тип которых не входит ни в одну категорию с лимитом
            в этом бюджете (категория без лимита или тип вне категорий).
          required: [actual]
          properties:
            actual: { type: string, format: decimal }
        totals:
          type: object
          required: [limit, budgetedActual, remaining, actual]
          properties:
            limit: { type: string, format: decimal, description: "Сумма лимитов." }
            budgetedActual: { type: string, format: decimal, description: "Факт по категориям с лимитом." }
            remaining: { type: string, format: decimal, description: "limit − budgetedActual." }
            actual: { type: string, format: decimal, description: "Все учтенные расходы месяца (budgetedActual + «Без бюджета»)." }
        rateSource: { type: string, example: Frankfurter }
        appliedRates:
          type: array
          description: Курсы, примененные к операциям в другой валюте, — по одной записи на (валюта, дата операции).
          items: { $ref: "#/components/schemas/BudgetAppliedRate" }
        excludedOperations:
          type: array
          description: Расходы, не вошедшие в суммы из-за отсутствия курса.
          items: { $ref: "#/components/schemas/BudgetExcludedOperation" }

    # ---- Funds (ADR-0010 §4) ----
    Fund:
      type: object
      required:
        [id, name, currencyId, targetAmount, reserved, progress, deficit, status,
         hasAllocationHistory, allocations, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        currencyId: { type: string, format: uuid }
        targetAmount: { $ref: "#/components/schemas/Money" }
        reserved:
          $ref: "#/components/schemas/Money"
          description: Сумма аллокаций фонда.
        progress:
          type: string
          format: decimal
          description: reserved / targetAmount, без округления (ADR-0005); 1 и больше — цель достигнута.
          example: "0.5"
        deficit:
          $ref: "#/components/schemas/Money"
          description: Сумма дефицитов обеспечения по аллокациям фонда (0 у закрытого фонда).
        linkedDebtId: { type: [string, "null"], format: uuid }
        linkedLoanId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [Active, Closed] }
        hasAllocationHistory:
          type: boolean
          description: По фонду были резервы (даже снятые) — фонд нельзя удалить и сменить ему валюту.
        allocations:
          type: array
          description: Ненулевые аллокации в порядке создания.
          items: { $ref: "#/components/schemas/FundAllocation" }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        closedAt: { type: [string, "null"], format: date-time, readOnly: true }
    FundAllocation:
      type: object
      required: [walletId, amount, deficit]
      properties:
        walletId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        deficit:
          $ref: "#/components/schemas/Money"
          description: >
            Дефицит обеспечения кошелька (его резервы всех фондов − баланс, не больше резервов),
            ограниченный суммой этой аллокации.
    FundCreateRequest:
      type: object
      required: [name, targetAmount, currencyId]
      properties:
        name: { type: string, maxLength: 200 }
        targetAmount: { type: string, format: decimal }
        currencyId: { type: string, format: uuid }
        linkedDebtId: { type: [string, "null"], format: uuid }
        linkedLoanId: { type: [string, "null"], format: uuid }
    FundUpdateRequest:
      type: object
      required: [name, targetAmount, currencyId]
      description: Все поля передаются целиком; пропущенная связь с долгом/кредитом снимается.
      properties:
        name: { type: string, maxLength: 200 }
        targetAmount: { type: string, format: decimal }
        currencyId: { type: string, format: uuid }
        linkedDebtId: { type: [string, "null"], format: uuid }
        linkedLoanId: { type: [string, "null"], format: uuid }
    FundAllocationRequest:
      type: object
      required: [walletId, amount]
      properties:
        walletId: { type: string, format: uuid }
        amount: { type: string, format: decimal, description: "Больше нуля, в валюте фонда" }
    FundPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Fund" } }
        pagination: { $ref: "#/components/schemas/CursorPageMeta" }
    WalletReservation:
      type: object
      required: [walletId, currencyId, balance, reserved, free, deficit]
      properties:
        walletId: { type: string, format: uuid }
        currencyId: { type: string, format: uuid }
        balance: { $ref: "#/components/schemas/Money" }
        reserved:
          $ref: "#/components/schemas/Money"
          description: Сумма аллокаций активных фондов по кошельку.
        free:
          $ref: "#/components/schemas/Money"
          description: balance − reserved; может быть отрицательной, если расходы опустили баланс ниже резервов.
        deficit:
          $ref: "#/components/schemas/Money"
          description: Дефицит обеспечения резерва = reserved − balance, если больше нуля, но не больше reserved.

  responses:
    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Отсутствует или неверен токен доступа
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Запись не найдена
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Конфликт с текущим состоянием (нарушение инварианта)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Слишком много попыток входа
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
