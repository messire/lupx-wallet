<div class="login-page">
  <app-card class="login-card" [padded]="false">
    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1 class="login-title">LupexWallet</h1>
      <p class="login-subtitle">Введите пароль приложения</p>

      <app-field label="Пароль" [error]="errorMessage()" [required]="true">
        <input
          appFieldControl
          type="password"
          formControlName="password"
          autocomplete="current-password"
          autofocus
        />
      </app-field>

      <app-button
        class="login-submit"
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [disabled]="form.invalid"
        [loading]="isSubmitting()"
        loadingText="Вход..."
      >
        Войти
      </app-button>
    </form>
  </app-card>
</div>
