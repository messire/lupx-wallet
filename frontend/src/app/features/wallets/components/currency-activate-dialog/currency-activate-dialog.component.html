<app-dialog [open]="open()" titleText="Новая активная валюта" size="sm" (dismissRequested)="onDismissRequested($event)" (closed)="cancel()">
  @if (open()) {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-field label="Валюта" [required]="true" [hint]="emptyHint()" [error]="codeError()">
        <app-currency-select
          [currencies]="options()"
          [placeholder]="isLoading() ? 'Загрузка…' : '— выберите валюту —'"
          [emptyListText]="isLoading() ? 'Загрузка…' : 'Список валют пуст'"
          formControlName="code"
        />
      </app-field>
      @if (loadError()) {
        <app-button variant="ghost" type="button" (click)="load()">Повторить</app-button>
      }

      @if (error(); as message) {
        <p class="form-error" role="alert">{{ message }}</p>
      }

      <div class="form-actions">
        <app-button type="submit" variant="primary" [loading]="isSubmitting()" loadingText="Сохранение…">Добавить</app-button>
        <app-button type="button" variant="secondary" [disabled]="isSubmitting()" (click)="cancel()">Отмена</app-button>
      </div>
    </form>
  }
</app-dialog>
