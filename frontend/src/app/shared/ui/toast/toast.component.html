<div
  class="app-toast"
  [class.app-toast--success]="tone() === 'success'"
  [class.app-toast--error]="tone() === 'error'"
  role="status"
  aria-live="polite"
>
  <span class="app-toast__message">{{ message() }}</span>
  <button type="button" class="app-toast__close" aria-label="Закрыть уведомление" (click)="onDismissClick()">
    <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
      <path d="M2 2l8 8M10 2l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
  </button>
</div>
