name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'release-candidates/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NODE_VERSION: '22'
  DOTNET_VERSION: '8.0.x'

jobs:
  frontend-checks:
    name: Frontend — boundaries, build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Feature-boundary architecture check
        run: npm run check:boundaries
      - name: Architecture check's own unit tests
        run: npm run check:boundaries:test
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm test -- --watch=false

  backend-checks:
    name: Backend — architecture, build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Module-boundary architecture check
        run: node scripts/check-architecture.mjs
      - name: Architecture check's own unit tests
        run: node --test scripts/lib/module-rules.test.mjs
      - name: Restore
        run: dotnet restore LupexWallet.sln
      - name: Production build
        run: dotnet build LupexWallet.sln --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test tests/LupexWallet.UnitTests/LupexWallet.UnitTests.csproj --no-build --configuration Release

  backend-integration-tests:
    name: Backend — integration tests (Testcontainers Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore LupexWallet.sln
      - name: Integration tests
        # Self-contained: each test class starts its own disposable Postgres
        # container via Testcontainers and applies EF Core migrations itself —
        # see backend/README.md. No docker-compose/service container needed,
        # only a Docker daemon, which GitHub-hosted ubuntu runners provide.
        run: dotnet test tests/LupexWallet.IntegrationTests/LupexWallet.IntegrationTests.csproj --configuration Release

  e2e:
    name: Browser smoke tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres-user
          POSTGRES_PASSWORD: postgres-pwd
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LupexWallet: Host=localhost;Port=5432;Database=postgres;Username=postgres-user;Password=postgres-pwd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start backend (dev auth/config, real Postgres)
        working-directory: backend
        run: |
          nohup dotnet run --project src/Host/LupexWallet.Api/LupexWallet.Api.csproj --configuration Release --urls http://localhost:5086 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5086/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat /tmp/backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npm start -- --port 4200 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4200 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time"
          cat /tmp/frontend.log
          exit 1

      - name: Run browser smoke tests
        working-directory: frontend
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:4200
        run: npm run e2e

      - name: Show backend/frontend logs on failure
        if: failure()
        run: |
          echo '--- backend.log ---'
          cat /tmp/backend.log || true
          echo '--- frontend.log ---'
          cat /tmp/frontend.log || true

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/e2e/screenshots/
          retention-days: 14
