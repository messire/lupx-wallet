<div class="shell">
  <header class="shell-header">
    <span class="brand">LupexWallet</span>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="shell-nav"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Меню разделов"
      (click)="toggleMenu()"
    >
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
    </button>

    <nav id="shell-nav" class="shell-nav" [class.open]="menuOpen()">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" (click)="closeMenu()">{{ item.label }}</a>
      }
      <button type="button" class="secondary logout" (click)="logout()">Выйти</button>
    </nav>
  </header>

  @if (menuOpen()) {
    <div class="shell-backdrop" (click)="closeMenu()"></div>
  }

  <main class="shell-content">
    <router-outlet />
  </main>
</div>
